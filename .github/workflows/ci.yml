name: Java CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile sources and tests
        run: |
          mkdir -p build
          javac --release 17 -d build $(find src test -name '*.java')
      - name: Run regression tests
        run: java -cp build tr.edu.ozyegin.cs101.blackbox.BlackBoxRegressionTest
